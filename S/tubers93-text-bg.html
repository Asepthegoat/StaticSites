<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title></title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
    background: #000;
  }
  #bg {
    position: fixed; inset: 0;
    background-image: url('https://i.scdn.co/image/ab67616d0000b27350fd8622e8b89ea525957aa2');
    background-size: cover;
    background-position: center;
    filter: brightness(0.55) contrast(1.1);
  }
  #vignette {
    position: fixed; inset: 0;
    box-shadow: inset 0 0 220px 90px #000;
    pointer-events: none;
  }
  #wrap {
    position: relative; z-index: 10;
    height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  #glitchTitle {
    font-size: 12vw; font-weight: bold; letter-spacing: 4px;
    color: #ff2b2b;
    text-shadow: 0 0 10px #ff2b2b, 0 0 24px #4a0000;
    position: relative;
    animation: flicker 4s infinite;
  }
  @media (min-width: 700px){ #glitchTitle{ font-size: 6rem; } }
  #glitchTitle::before, #glitchTitle::after {
    content: attr(data-text); position: absolute; left: 0; top: 0; width: 100%;
    overflow: hidden; background: transparent;
  }
  #glitchTitle::before { left: 3px; text-shadow: -2px 0 #00e5ff; animation: glitchTop 2.2s infinite linear alternate-reverse; }
  #glitchTitle::after { left: -3px; text-shadow: -2px 0 #ffffff; animation: glitchBot 3.1s infinite linear alternate-reverse; }
  @keyframes glitchTop {
    0% { clip-path: inset(0 0 85% 0); transform: translate(0,0); }
    20% { clip-path: inset(10% 0 60% 0); transform: translate(-4px,-1px); }
    40% { clip-path: inset(40% 0 30% 0); transform: translate(4px,1px); }
    60% { clip-path: inset(75% 0 5% 0); transform: translate(-3px,0); }
    80% { clip-path: inset(5% 0 80% 0); transform: translate(3px,1px); }
    100% { clip-path: inset(50% 0 20% 0); transform: translate(0,-1px); }
  }
  @keyframes glitchBot {
    0% { clip-path: inset(80% 0 0 0); transform: translate(0,0); }
    20% { clip-path: inset(30% 0 40% 0); transform: translate(3px,0); }
    40% { clip-path: inset(5% 0 70% 0); transform: translate(-3px,1px); }
    60% { clip-path: inset(60% 0 10% 0); transform: translate(3px,-1px); }
    80% { clip-path: inset(20% 0 55% 0); transform: translate(-3px,0); }
    100% { clip-path: inset(0 0 90% 0); transform: translate(0,1px); }
  }
  @keyframes flicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
    20%, 22%, 24%, 55% { opacity: 0.35; }
  }
  #scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 20;
    background: repeating-linear-gradient(
      0deg, rgba(255,0,0,0.035) 0px, rgba(255,0,0,0.035) 1px,
      transparent 2px, transparent 4px
    );
    mix-blend-mode: overlay;
  }
</style>
</head>
<body>

<div id="bg"></div>
<div id="vignette"></div>
<div id="scanlines"></div>
<audio src=""></audio>
<div id="wrap">
  <div id="glitchTitle" data-text="HERLAMBANG">TUBERS93</div>
  <audio src="play loop.aac" loop></audio>
  <audio src="play loop.mpeg" loop></audio>
  <audio src="You Are An Idiot.mpeg" loop></audio>
  <audio src="Init.mpeg"></audio>
  
</div>
<script>
function generatevarchar(length) {
  const chars = "abcdefghijklmnopqrstuvwxyz♪♦♥♠♣§£¢€¥ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=[]{}|;:,.<>/?†‡★·±\\∆•~μΠΩ√÷×¶←↑↓→°∞≠≈✓àâåæãáääßöō";
  let result = "";

  for (let i = 0; i < length; i++) {
    const rand = Math.floor(Math.random() * chars.length);
    result += chars[rand];
  }

  return result;
}
let integer = 5
setInterval(async () => {
  document.title = generatevarchar(8)
  document.getElementById("glitchTitle").textContent = generatevarchar(10)
  await new Promise((res) =>{
    setTimeout(res, 10);
  })
  if(integer >= 5){
    document.getElementById("glitchTitle").textContent = "HERLAMBANG"
    integer = 0
  }
  integer += 1
  await new Promise((res) =>{
    setTimeout(res, 10);
  })
}, 60);

let is_init_done = false
const elsize = 150
const elsize2 = 100
const arr = [
  "https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/22310826/poptart1redrainbowfix_1.gif?quality=90&strip=all&crop=0%2C16.666666666667%2C100%2C66.666666666667&w=1080",
  "https://media.tenor.com/Yu6hxXsnGY8AAAAi/cat-alien-cat.gif",
  "https://media1.tenor.com/m/wCxmu-WUQo4AAAAC/yaai-virus.gif",
  "https://media1.tenor.com/m/4AvG7Vit5wcAAAAd/vince-5mb-money.gif"
]
let w = 0
function showstuff(){
  if(w > (arr.length - 1)){ w = 0}
  const ran = Math.random() * (window.innerWidth - 2 * elsize) + 10;
  const ran2 = Math.random() * (window.innerHeight - 2 * elsize2) + 10;
  const a = document.createElement("img")
  a.src = arr[w]
  w++
  a.style.position = "absolute"
  a.style.left = ran + "px"
  a.style.top = ran2 + "px"
  a.style.width = elsize + "px"
  a.style.height = elsize2 + "px"
  document.body.appendChild(a)
  setTimeout(()=>{a.remove()},2500)
}

async function startchaos() {
  for(let i = 1;i <= 10;i++){
    setInterval(showstuff, 1000);
    await new Promise((resolve) => {
      setTimeout(resolve, 800);
    })
  }
}

function init(){
  if(is_init_done){ return }
  document.getElementById("wrap").querySelectorAll("audio").forEach(el =>{
    el.play()
    el.volume = 1
  })
  startchaos()
  is_init_done = true
}

document.addEventListener("click",init)
document.addEventListener("pointerdown",init)
document.addEventListener("pointerup",init)
document.addEventListener("touchstart",init)
document.addEventListener("keydown",init)
document.addEventListener("keyup",init)
document.addEventListener("mousedown",init)
document.addEventListener("mouseup",init)
</script>
</body>
</html>
