<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: #0f1117;
            color: white;
            padding: 40px;
        }

        h1{
            font-size: 30px;
            margin-bottom: 25px;
            border-left: 5px solid #4f8cff;
            padding-left: 15px;
        }

        #items{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .card{
            background: #1a1d26;
            border: 1px solid #2c3242;
            border-radius: 15px;
            padding: 20px;
            width: 40%;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .card:hover{
            transform: translateY(-5px);
            border-color: #4f8cff;
        }

        .card h2{
            margin-bottom: 15px;
            color: #4f8cff;
        }

        .card img{
            object-fit: cover;
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .card p{
            color: #b8bcc7;
            line-height: 1.6;
        }
        @media (max-width: 1000px) {
            .card{
                background: #1a1d26;
                border: 1px solid #2c3242;
                border-radius: 15px;
                padding: 20px;
                width: 96%;
                box-shadow: 0 0 15px rgba(0,0,0,0.3);
                transition: 0.3s;
            }
        }
    </style>
</head>
<body>

    <h1>Lingkungan</h1>

    <div id="items"></div>

    <script>
        const testimg = "https://i.pinimg.com/236x/ed/9f/03/ed9f03668224689aa59d2d80e8d55e78.jpg"
        function getId(id){
            return document.getElementById(id)
        }

        const items = getId("items")

        function addItem(title,source,desc){
            items.innerHTML += `
            <div class="card">
                <h2>${title}</h2>
                <img src="${source}">
                <p>${desc}</p>
            </div>`
        }

        addItem(
            "Gedung",
            "https://raw.githubusercontent.com/Asepthegoat/StaticSites/refs/heads/main/S/gedung.jpg",
            "Bangunan utama sekolah yang terdiri dari ruang kelas, kantor guru, dan fasilitas belajar lainnya."
        )
        addItem(
            "Lab Komputer",
            "https://raw.githubusercontent.com/Asepthegoat/StaticSites/refs/heads/main/S/lab-rpl.jpg",
            "Laboratorium yang digunakan untuk belajar pemrograman, komputer, dan pengembangan perangkat lunak."
        )
        addItem(
            "Kantin",
            "https://raw.githubusercontent.com/Asepthegoat/StaticSites/refs/heads/main/S/kantin.jpg",
            "Tempat siswa membeli makanan dan minuman saat jam istirahat dengan suasana santai dan nyaman."
        )
        addItem(
            "Musholah",
            "https://raw.githubusercontent.com/Asepthegoat/StaticSites/refs/heads/main/S/musolah.jpg",
            "Tempat ibadah di lingkungan sekolah yang digunakan siswa dan guru untuk melaksanakan salat dan kegiatan keagamaan."
        )
    </script>

</body>
</html>
