<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: #0f1117;
            color: white;
            padding: 40px;
        }

        h1{
            font-size: 40px;
            margin-bottom: 25px;
            border-left: 5px solid #4f8cff;
            padding-left: 15px;
        }

        #items{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .card{
            background: #1a1d26;
            border: 1px solid #2c3242;
            border-radius: 15px;
            padding: 20px;
            width: 40%;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .card:hover{
            transform: translateY(-5px);
            border-color: #4f8cff;
        }

        .card h2{
            margin-bottom: 15px;
            color: #4f8cff;
        }

        .card img{
            object-fit: cover;
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .card p{
            color: #b8bcc7;
            line-height: 1.6;
        }
        @media (max-width: 1000px) {
            .card{
                background: #1a1d26;
                border: 1px solid #2c3242;
                border-radius: 15px;
                padding: 20px;
                width: 46%;
                box-shadow: 0 0 15px rgba(0,0,0,0.3);
                transition: 0.3s;
            }
        }
    </style>
</head>
<body>

    <h1>Lingkungan</h1>

    <div id="items"></div>

    <script>
        const testimg = "https://i.pinimg.com/236x/ed/9f/03/ed9f03668224689aa59d2d80e8d55e78.jpg"
        function getId(id){
            return document.getElementById(id)
        }

        const items = getId("items")

        function addItem(title,source,desc){
            items.innerHTML += `
            <div class="card">
                <h2>${title}</h2>
                <img src="${source}">
                <p>${desc}</p>
            </div>`
        }

        addItem(
            "Gedung",
            testimg,
            "Lorem ipsum dolor sit amet consectetur adipisicing elit."
        )
        addItem(
            "Lab Komputer",
            testimg,
            "Lorem ipsum dolor sit amet consectetur adipisicing elit."
        )
        addItem(
            "Kantin",
            testimg,
            "Lorem ipsum dolor sit amet consectetur adipisicing elit."
        )
        addItem(
            "Kelas",
            testimg,
            "Lorem ipsum dolor sit amet consectetur adipisicing elit."
        )
    </script>

</body>
</html>
